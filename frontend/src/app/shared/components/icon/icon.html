<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-linecap="round"
  stroke-linejoin="round"
  [attr.width]="size()"
  [attr.height]="size()"
  [attr.stroke-width]="strokeWidth()"
  focusable="false"
>
  @for (shape of shapes(); track $index) {
    @switch (shape.tag) {
      @case ('path') {
        <svg:path [attr.d]="shape.attrs['d']" />
      }
      @case ('circle') {
        <svg:circle [attr.cx]="shape.attrs['cx']" [attr.cy]="shape.attrs['cy']" [attr.r]="shape.attrs['r']" />
      }
      @case ('line') {
        <svg:line
          [attr.x1]="shape.attrs['x1']"
          [attr.y1]="shape.attrs['y1']"
          [attr.x2]="shape.attrs['x2']"
          [attr.y2]="shape.attrs['y2']"
        />
      }
      @case ('polyline') {
        <svg:polyline [attr.points]="shape.attrs['points']" />
      }
      @case ('polygon') {
        <svg:polygon [attr.points]="shape.attrs['points']" />
      }
      @case ('rect') {
        <svg:rect
          [attr.x]="shape.attrs['x']"
          [attr.y]="shape.attrs['y']"
          [attr.width]="shape.attrs['width']"
          [attr.height]="shape.attrs['height']"
          [attr.rx]="shape.attrs['rx']"
          [attr.ry]="shape.attrs['ry']"
        />
      }
    }
  }
</svg>
