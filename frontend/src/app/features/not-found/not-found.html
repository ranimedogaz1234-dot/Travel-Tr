<section class="not-found">
  <div class="container content fade-up">
    <span class="icon"><app-icon name="compass" [size]="44" [strokeWidth]="1.6" /></span>
    <p class="code">404</p>
    <h1>Cette page s’est perdue en chemin</h1>
    <p>La page que vous cherchez n’existe pas ou a été déplacée. Reprenons la route ensemble.</p>
    <div class="actions">
      <a routerLink="/" class="btn btn-primary"><app-icon name="arrow-left" [size]="18" />Retour à l’accueil</a>
      <a routerLink="/destinations" class="btn btn-outline">Voir les destinations</a>
    </div>
  </div>
</section>
